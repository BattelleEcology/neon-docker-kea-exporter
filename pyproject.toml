[project]
name = "neon-docker-kea-exporter"
version = "0.0.0"
description = "ISC kea dhcp exporter for prometheus metrics"
readme = "README.md"
# Lowest supported Python. The image uses the uv-managed Python pinned in .python-version
requires-python = ">=3.14"
dependencies = [
    "kea-exporter>=0.7.1",
]

[tool.uv]
# Only the dependencies are installed; this repo has no Python package of its own
package = false
